name: CI QA Desk

# O deploy da VM (qa-desk/deploy/oracle/auto-deploy.sh) só publica um commit
# do main depois que este workflow termina verde nele.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: qa-desk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa-desk/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Testes unitários do servidor
        run: npm run test:unit

      - name: Build do front
        run: npm run build

      - name: Testes de API (servidor em modo mock)
        run: npm run test:api

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      # @local = specs que dependem de data/projects (fora do Git); a massa dos outros é criada pela API.
      - name: E2E de interface e acessibilidade (axe)
        run: npm run e2e -- --grep-invert "@local"

      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: qa-desk/e2e/playwright-report
          retention-days: 14

      - uses: grafana/setup-k6-action@v1

      - name: Teste de carga da API (k6)
        run: |
          npm run e2e:api:carga > /tmp/api-carga.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3011/api/health > /dev/null && break; sleep 1; done
          npm run test:carga
          cat e2e/carga/resumo.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultado da carga
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultado-carga
          path: qa-desk/e2e/carga/resultado.json
          if-no-files-found: ignore
          retention-days: 14
