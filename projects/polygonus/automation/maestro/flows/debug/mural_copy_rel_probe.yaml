appId: br.com.polygonus.mobile.amostra
---
- runFlow: ../shared/mural/setup_coordenador_mural.yaml
- runFlow: ../shared/mural/filtrar_enviadas.yaml
- copyTextFrom:
    below:
      id: "mural_card_menu"
      index: 0
    index: 0
    optional: true
- evalScript: '${output.below = maestro.copiedText || ""}'
- copyTextFrom:
    childOf:
      id: "mural_card_menu"
      index: 0
    index: 0
    optional: true
- evalScript: '${output.child = maestro.copiedText || ""}'
- assertTrue: ${(output.below + output.child).length > 0}
