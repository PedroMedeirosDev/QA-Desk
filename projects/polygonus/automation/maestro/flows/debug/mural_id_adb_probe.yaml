appId: br.com.polygonus.mobile.amostra
---
- evalScript: |
    ${(() => {
      try {
        var pb = new java.lang.ProcessBuilder("adb", "shell", "uiautomator", "dump", "/sdcard/uidump.xml");
        pb.redirectErrorStream(true);
        var p = pb.start();
        p.waitFor();
        var pb2 = new java.lang.ProcessBuilder("adb", "shell", "cat", "/sdcard/uidump.xml");
        pb2.redirectErrorStream(true);
        var p2 = pb2.start();
        var reader = new java.io.BufferedReader(new java.io.InputStreamReader(p2.getInputStream()));
        var line, xml = "";
        while ((line = reader.readLine()) != null) { xml += line; }
        p2.waitFor();
        var m = xml.match(/ID[\s\u00a0]*([0-9]+)/);
        output.idFromAdb = m ? ("ID " + m[1]) : "";
      } catch (e) {
        output.idFromAdb = "";
        output.adbErr = String(e);
      }
    })()}
- assertTrue: ${output.idFromAdb.length > 0}
