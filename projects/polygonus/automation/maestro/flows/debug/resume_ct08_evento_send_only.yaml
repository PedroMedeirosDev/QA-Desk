# Retomada CT-08: texto já preenchido ("Evento Padrao"). Só enviar → Enviadas.

appId: br.com.polygonus.mobile.amostra
---
- extendedWaitUntil:
    visible: "Novo evento|Para:"
    timeout: 10000

- runFlow: ../shared/mural/enviar_comunicado.yaml

- swipe:
    start: "50%, 28%"
    end: "50%, 72%"
    duration: 400
- waitForAnimationToEnd

- runFlow: ../shared/mural/filtrar_enviadas.yaml
