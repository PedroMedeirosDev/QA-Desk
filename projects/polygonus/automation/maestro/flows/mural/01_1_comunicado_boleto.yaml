# CT-MURAL-11: Boleto + Inadimplentes + mês corrente
#
# Funil → Inadimplentes → Mes corrente → Ok
# Clipe → Boleto
# Texto de cobrança.
# Fase 1 → Enviadas; fase 2 qa-desk: ID + ETMENEZES.

appId: br.com.polygonus.mobile.amostra
---
- runFlow: ../shared/mural/setup_coordenador_mural.yaml

- runFlow: ../shared/mural/abrir_novo_comunicado.yaml
- runFlow: ../shared/mural/selecionar_turmas_comunicado.yaml
- runFlow: ../shared/mural/selecionar_alvo_todos.yaml

- runFlow: ../shared/mural/selecionar_filtro_inadimplentes.yaml
- runFlow: ../shared/mural/selecionar_periodo_mes_corrente.yaml

- runFlow: ../shared/mural/anexar_boleto.yaml
# Se Boleto reabrir Período, confirma mês corrente de novo
- runFlow:
    when:
      visible: "Período|Periodo|Mes corrente|Mês corrente"
    file: ../shared/mural/selecionar_periodo_mes_corrente.yaml

- runFlow:
    file: ../shared/mural/escrever_comunicado.yaml
    env:
      TEXTO_COMUNICADO: "Teste Maestro Emulador - Nao detectamos o pagamento do boleto anexado. Por favor, providencie o pagamento."

- runFlow: ../shared/mural/enviar_comunicado.yaml

- swipe:
    start: "50%, 28%"
    end: "50%, 72%"
    duration: 400
- waitForAnimationToEnd

- runFlow: ../shared/mural/filtrar_enviadas.yaml
