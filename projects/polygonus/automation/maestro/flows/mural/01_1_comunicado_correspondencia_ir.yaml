# CT-MURAL-12: Comunicado com Correspondência (amostra: Aviso de Débito)
#
# Clipe → Correspondência → item da lista → Ok.
# Na amostra nao ha "Declaracao de IR" — usa Aviso de Debito n 02.
# Fase 1: envia → Enviadas. Fase 2 (qa-desk): adb ID → assert + ETMENEZES.

appId: br.com.polygonus.mobile.amostra
---
- runFlow: ../shared/mural/setup_coordenador_mural.yaml

- runFlow:
    file: ../shared/mural/composer_novo_comunicado.yaml
    env:
      TEXTO_COMUNICADO: "Teste Maestro Emulador - Teste Comunicado correspondencia"

- runFlow: ../shared/mural/anexar_correspondencia_declaracao_ir.yaml
- runFlow: ../shared/mural/enviar_comunicado.yaml

- swipe:
    start: "50%, 28%"
    end: "50%, 72%"
    duration: 400
- waitForAnimationToEnd

- runFlow: ../shared/mural/filtrar_enviadas.yaml
