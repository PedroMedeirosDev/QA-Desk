# CT-MURAL-02 — Editar comunicado (Enviadas)
#
# Pré-requisito: ao menos 1 comunicado em Enviadas (qualquer texto).
# Edita o mais recente; valida pelo ID capturado + texto novo.
#
# Via qa-desk: prep → adb captura ID → executa flow gerado com ID literal
# (este YAML é o registro do CT; o runtime pode substituí-lo por .generated/).
# Via CLI: maestro test -e ID_COMUNICADO=<digitos> mural/01_1_comunicado_editar.yaml
#
# Contrato: resume → ação → teardown

appId: br.com.polygonus.mobile.amostra
---
- runFlow: ../shared/mural/setup_coordenador_mural.yaml

# ID injetado pela qa-desk em flows/.env + -e (evalScript inline no flow raiz).
- evalScript: |
    ${(() => {
      if (output.idComunicado && String(output.idComunicado).length > 3) return;
      var raw = "";
      try {
        if (typeof ID_COMUNICADO !== "undefined" && ID_COMUNICADO) {
          raw = String(ID_COMUNICADO).trim();
        }
      } catch (e) {}
      var digits = raw.replace(/[^0-9]/g, "");
      if (digits.length > 0) {
        output.idComunicado = "ID " + digits;
      } else if (!output.idComunicado) {
        output.idComunicado = "";
      }
    })()}

- assertTrue: ${(output.idComunicado || "").length > 3}

- runFlow:
    file: ../shared/mural/editar_comunicado_lista.yaml
    env:
      NOVO_TEXTO: "Teste Comunicado editado CT02"
      ID_COMUNICADO: ${ID_COMUNICADO}
      MURAL_ID: ${output.idComunicado}

- runFlow: ../shared/auth/teardown_estavel_sessao.yaml
