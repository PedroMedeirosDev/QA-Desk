# CT-MURAL-04: Comunicado com enquete ("Nova")
#
# Fase 1: setup → composer + enquete → Enviadas.
# Fase 2 (qa-desk): adb ID → assert por ID → teardown.

appId: br.com.polygonus.mobile.amostra
---
- runFlow: ../shared/mural/setup_coordenador_mural.yaml

- runFlow:
    file: ../shared/mural/composer_novo_comunicado.yaml
    env:
      TEXTO_COMUNICADO: "Teste Comunicado enquete"

- runFlow: ../shared/mural/adicionar_enquete_nova.yaml
- runFlow: ../shared/mural/enviar_comunicado.yaml

- runFlow: ../shared/mural/filtrar_enviadas.yaml
