# CT-MURAL-13: Evento com "Dia inteiro"
#
# Turmas + alvo Todos → liga Dia inteiro → texto "Evento Dia Inteiro".
# Fase 1: envia → Enviadas. Fase 2 (qa-app): adb ID → assert + ETMENEZES.

appId: br.com.polygonus.mobile.amostra
---
- runFlow: ../shared/mural/setup_coordenador_mural.yaml

- runFlow:
    file: ../shared/mural/composer_novo_evento.yaml
    env:
      TEXTO_COMUNICADO: "Evento Dia Inteiro"
      TITULO_EVENTO: "Evento Dia Inteiro"
      DIA_INTEIRO: "1"

- runFlow: ../shared/mural/enviar_comunicado.yaml

- swipe:
    start: "50%, 28%"
    end: "50%, 72%"
    duration: 400
- waitForAnimationToEnd

- runFlow: ../shared/mural/filtrar_enviadas.yaml
