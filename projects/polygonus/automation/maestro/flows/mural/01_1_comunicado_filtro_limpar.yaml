# FILTRO-10: Aplica Pagantes → Limpar filtro → envia sem filtro ativo.
# STATUS: draft

appId: br.com.polygonus.mobile.amostra
---
- runFlow: ../shared/mural/setup_coordenador_mural.yaml

- runFlow: ../shared/mural/abrir_novo_comunicado.yaml
- runFlow: ../shared/mural/selecionar_turmas_comunicado.yaml
- runFlow: ../shared/mural/selecionar_alvo_todos.yaml

- runFlow:
    file: ../shared/mural/selecionar_filtro_extras.yaml
    env:
      FILTRO_EXTRAS: "Pagantes|Pagante"

- runFlow: ../shared/mural/abrir_filtro_extras_composer.yaml
- runFlow:
    when:
      visible:
        id: "mural_composer_filtro_limpar"
    commands:
      - tapOn:
          id: "mural_composer_filtro_limpar"
- runFlow:
    when:
      notVisible:
        id: "mural_composer_filtro_limpar"
    commands:
      - tapOn: "Limpar filtro|Limpar"
- waitForAnimationToEnd:
    timeout: 500
- extendedWaitUntil:
    visible: "Novo comunicado|Para:|Escreva seu texto aqui"
    timeout: 8000

- runFlow:
    file: ../shared/mural/escrever_comunicado.yaml
    env:
      TEXTO_COMUNICADO: "Teste Maestro Emulador - Teste filtro Limpar filtro"

- runFlow: ../shared/mural/enviar_comunicado.yaml

- swipe:
    start: "50%, 28%"
    end: "50%, 72%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 500

- runFlow: ../shared/mural/filtrar_enviadas.yaml
- runFlow: ../shared/auth/teardown_estavel_sessao.yaml
