# CT-MURAL-05: Comunicado com foto da galeria + Compartilhar anexos
#
# Fase 1: addMedia → composer + foto → Enviadas.
# Fase 2 (qa-desk): adb ID → assert → ETMENEZES → Compartilhar anexos → teardown.
# Critério compartilhar: só abrir o item (download); não concluir share sheet.

appId: br.com.polygonus.mobile.amostra
---
- addMedia:
    - "../../fixtures/Foto_1.jpeg"

- runFlow: ../shared/mural/setup_coordenador_mural.yaml

- runFlow:
    file: ../shared/mural/composer_novo_comunicado.yaml
    env:
      TEXTO_COMUNICADO: "Teste Maestro Emulador - Teste Comunicado foto"

- runFlow: ../shared/mural/adicionar_foto_galeria.yaml
- runFlow: ../shared/mural/enviar_comunicado.yaml

- swipe:
    start: "50%, 28%"
    end: "50%, 72%"
    duration: 400
- waitForAnimationToEnd

- runFlow: ../shared/mural/filtrar_enviadas.yaml
