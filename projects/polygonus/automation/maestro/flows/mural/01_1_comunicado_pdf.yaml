# CT-MURAL-06: Comunicado com anexo PDF
#
# Mesmo padrão do CT-05 (foto): fase 1 envia → fase 2 qa-app valida por ID + responsável.
# Pré-requisito: push fixtures + FIXTURE_PDF no .env

appId: br.com.polygonus.mobile.amostra
---
- runFlow: ../shared/mural/setup_coordenador_mural.yaml

- runFlow:
    file: ../shared/mural/composer_novo_comunicado.yaml
    env:
      TEXTO_COMUNICADO: "Teste Comunicado PDF"

- runFlow:
    file: ../shared/mural/anexar_arquivo_por_nome.yaml
    env:
      # Preferir literal: ${FIXTURE_PDF} com espaço falha em runFlow aninhado (vira undefined).
      ANEXO_NOME: "PDF TESTE.pdf"
      ANEXO_PASTA: "Download"

- runFlow: ../shared/mural/enviar_comunicado.yaml

- swipe:
    start: "50%, 28%"
    end: "50%, 72%"
    duration: 400
- waitForAnimationToEnd

- runFlow: ../shared/mural/filtrar_enviadas.yaml
