# CT-MURAL-10: PHJESUS como Professor envia; depois como Coordenador vê Pendentes
#
# Contrato: ENTRAR → ação → ENTRAR
# Contas:
#   PHJESUS — professor E coordenador (alterna na tela Perfil)
#   ACMENEZES — ALUNO (Eliza); não usa este fluxo para envio
# STATUS: draft — STUDIO: taps de Perfil / BoomMenu

appId: br.com.polygonus.mobile.amostra
---
# ── 1. Enviar como Professor (PHJESUS) ────────────────────────────────────────
- runFlow: ../shared/auth/login_phjesus.yaml

- runFlow: ../shared/perfil/garantir_perfil_professor.yaml

- runFlow: ../shared/nav/navegar_mural.yaml

- runFlow: ../shared/mural/abrir_novo_comunicado.yaml

- runFlow: ../shared/mural/selecionar_turmas_comunicado.yaml

- runFlow:
    file: ../shared/mural/escrever_comunicado.yaml
    env:
      TEXTO_COMUNICADO: "Teste Comunicado professor"

- runFlow: ../shared/mural/enviar_comunicado.yaml

- assertVisible:
    text: "Teste Comunicado professor"
    optional: true

# ── 2. Conferir Pendentes como Coordenador (mesmo login PHJESUS) ──────────────
- runFlow: ../shared/perfil/garantir_perfil_coordenador.yaml

- runFlow: ../shared/nav/navegar_mural.yaml

- tapOn:
    text: "Pendentes"
    optional: true

- assertVisible:
    text: "Teste Comunicado professor"
    optional: true

# ── 3. TEARDOWN ───────────────────────────────────────────────────────────────
- runFlow: ../shared/auth/ensure_logged_out.yaml
