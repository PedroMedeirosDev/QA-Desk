# CT-MURAL-07: Comunicado com vídeo pequeno (anexo clip)
#
# Vídeo/PDF usam o ícone clipe (mural_composer_anexo), NÃO a galeria (extrema esquerda).
# Fase 1: envia → Enviadas. Fase 2 (qa-desk): adb ID → assert + ETMENEZES.
#
# Pré-requisito: Video_teste.mp4 em fixtures/ + push para /sdcard/Download (ou Movies)

appId: br.com.polygonus.mobile.amostra
---
- runFlow: ../shared/mural/setup_coordenador_mural.yaml

- runFlow:
    file: ../shared/mural/composer_novo_comunicado.yaml
    env:
      TEXTO_COMUNICADO: "Teste Comunicado video"

- runFlow:
    file: ../shared/mural/anexar_arquivo_por_nome.yaml
    env:
      ANEXO_NOME: "Video_teste.mp4"
      ANEXO_PASTA: "Download"

- runFlow: ../shared/mural/enviar_comunicado.yaml

- swipe:
    start: "50%, 28%"
    end: "50%, 72%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 500

- runFlow: ../shared/mural/filtrar_enviadas.yaml

