# CT-MURAL-09: Filtro Enviadas no Mural
#
# Contrato: ENTRAR → ação → ENTRAR
# Strings: types.dart — Recebidas / Enviadas / Pendentes / Aprovadas
# STATUS: draft — depende de ao menos 1 comunicado já enviado

appId: br.com.polygonus.mobile.amostra
---
- runFlow: ../shared/auth/login_phjesus.yaml

- runFlow: ../shared/perfil/garantir_perfil_coordenador.yaml

- runFlow: ../shared/nav/navegar_mural.yaml

- tapOn: "Enviadas"

- extendedWaitUntil:
    visible: "Enviadas"
    timeout: 10000

- assertVisible: "Enviadas"

- tapOn:
    text: "Recebidas"
    optional: true

- runFlow: ../shared/auth/ensure_logged_out.yaml
