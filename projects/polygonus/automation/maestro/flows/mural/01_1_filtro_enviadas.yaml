# CT-MURAL-09: Filtro Enviadas no Mural
#
# Contrato: resume → ação → teardown
# Pré-requisito: ao menos 1 comunicado enviado (CT-MURAL-01).

appId: br.com.polygonus.mobile.amostra
---
- runFlow: ../shared/mural/setup_coordenador_mural.yaml

- runFlow: ../shared/mural/filtrar_enviadas.yaml
- assertVisible: "Enviados|Enviadas|Teste Comunicado"

- runFlow: ../shared/mural/filtrar_recebidas.yaml
- extendedWaitUntil:
    visible: "Recebidas|Responder comunicado"
    timeout: 10000

- runFlow: ../shared/auth/teardown_estavel_sessao.yaml
