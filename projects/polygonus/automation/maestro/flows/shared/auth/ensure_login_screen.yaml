# PORTO SEGURO — chega em ENTRAR SEM limpar dados do app.
#
# Regra do produto: sessão e tutoriais persistem até clearState / clear data.
# clearState:true reseta onboarding (PULAR etc.) e sessão — NÃO usar no CT normal.
#
# Estratégia:
#   1. Já em ENTRAR → ok
#   2. App aberto logado → logout (Back → nome → Sair)
#   3. App morto → launchApp SEM clearState (restaura última sessão) → logout
#   4. Onboarding só se ainda aparecer (1ª instalação)

appId: br.com.polygonus.mobile.amostra
---
- launchApp

- extendedWaitUntil:
    visible: "PULAR|ENTRAR|FAZER LOGIN|Colégio Polygonus|.*Acompanhe de perto.*"
    timeout: 20000

- runFlow: ../nav/dismiss_coachmarks_pular.yaml

# Onboarding só na 1ª vez (wipe / clearState)
- runFlow: dismiss_onboarding_primeira_instalacao.yaml

# Logado em qualquer tela → logout gracioso
- runFlow:
    when:
      notVisible: "ENTRAR"
    commands:
      - runFlow: logout.yaml

- extendedWaitUntil:
    visible: "ENTRAR"
    timeout: 25000

- assertVisible: "E-mail ou Login"
- assertVisible: "Senha"
- assertVisible: "Versão:.*"
