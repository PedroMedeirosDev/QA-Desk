# Autentica a partir da tela ENTRAR e espera a home (header com nome).
#
# Env obrigatório:
#   LOGIN / SENHA
# Env opcional:
#   NOME_USUARIO — nome no header (ex.: "Pedro Jesus"); se omitido, aceita CARDÁPIO
#
# NÃO exige MURAL aqui: o card MURAL só aparece depois de selecionar
# a função Coordenador/Professor na tela Perfil (ver garantir_perfil_*).

appId: br.com.polygonus.mobile.amostra
---
- assertVisible: "ENTRAR"

- tapOn: "E-mail ou Login"
- eraseText
- inputText: ${LOGIN}

- tapOn: "Senha"
- eraseText
- inputText: ${SENHA}

- tapOn: "ENTRAR"

# Spotlight / tutorial pós-login
- runFlow:
    when:
      visible: "PULAR"
    commands:
      - tapOn: "PULAR"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "PULAR"
    commands:
      - tapOn: "PULAR"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "PULAR"
    commands:
      - tapOn: "PULAR"
      - waitForAnimationToEnd

# Home: header com nome OU ao menos um card (CARDÁPIO)
- extendedWaitUntil:
    visible: "Pedro Jesus|CARDÁPIO|.*MURAL.*"
    timeout: 30000
