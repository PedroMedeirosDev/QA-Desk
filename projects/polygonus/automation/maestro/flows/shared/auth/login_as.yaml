# Autentica a partir da tela ENTRAR.
#
# Env: LOGIN, SENHA, NOME_USUARIO (opcional)
# Semantics: auth_login_usuario, auth_login_senha, auth_login_entrar

appId: br.com.polygonus.mobile.amostra
---
- runFlow:
    when:
      visible:
        id: "auth_login_usuario"
    commands:
      - tapOn:
          id: "auth_login_usuario"

- runFlow:
    when:
      notVisible:
        id: "auth_login_usuario"
    commands:
      - tapOn: "E-mail ou Login"

- eraseText
- inputText: ${LOGIN}

- runFlow:
    when:
      visible:
        id: "auth_login_senha"
    commands:
      - tapOn:
          id: "auth_login_senha"

- runFlow:
    when:
      notVisible:
        id: "auth_login_senha"
    commands:
      - tapOn: "Senha"

- eraseText
- inputText: ${SENHA}

- runFlow:
    when:
      visible:
        id: "auth_login_entrar"
    commands:
      - tapOn:
          id: "auth_login_entrar"

- runFlow:
    when:
      notVisible:
        id: "auth_login_entrar"
    commands:
      - runFlow:
          when:
            visible: "ENTRAR"
          commands:
            - runFlow:
                when:
                  visible: "E-mail ou Login"
                commands:
                  - tapOn: "ENTRAR"

# Confirmação visual (não waitForAnimation — idle da UI pode segurar 10s+)
- runFlow: ../nav/dismiss_coachmarks_pular.yaml

- extendedWaitUntil:
    visible: "${NOME_USUARIO}"
    timeout: 15000
