# Logout → ENTRAR via menu do usuário (NÃO drawer).
# Idempotente: se já estiver em ENTRAR, não faz nada.
#
# CARDÁPIO no loop de Back = home de PHJESUS em SUPORTE (não prova outro perfil).

appId: br.com.polygonus.mobile.amostra
---
- runFlow:
    when:
      visible: "ENTRAR"
    commands:
      - assertVisible: "ENTRAR"

- runFlow:
    when:
      notVisible: "ENTRAR"
    commands:
      - runFlow:
          when:
            visible: "Back"
          commands:
            - tapOn: "Back"
            - waitForAnimationToEnd:
                timeout: 500
            - runFlow: ../mural/fechar_gravacao_pendente.yaml

      - repeat:
          times: 5
          commands:
            - runFlow:
                when:
                  notVisible: "ENTRAR|Pedro Jesus|Pedro|Ana|Bruno|Davi|CARDÁPIO|CARDAPIO"
                  visible: "Back|Show menu|Responder comunicado|Comunicado"
                commands:
                  - pressKey: Back
                  - waitForAnimationToEnd:
                      timeout: 500
                  - runFlow: ../mural/fechar_gravacao_pendente.yaml
                  - tapOn:
                      text: "CANCELAR"
                      optional: true
                  - tapOn:
                      text: "Cancelar"
                      optional: true

      - runFlow: ../nav/dismiss_coachmarks_pular.yaml

      - runFlow:
          when:
            visible: "ENTRAR"
          commands:
            - assertVisible: "ENTRAR"

      - runFlow:
          when:
            notVisible: "ENTRAR"
          commands:
            - extendedWaitUntil:
                visible: ".*MURAL.*|CARDÁPIO|CARDAPIO|Pedro Jesus|Pedro|Eliza|Teixeira|Ana|Bruno|Davi"
                timeout: 12000
            - waitForAnimationToEnd:
                timeout: 500
            # Abre menu do usuário (Semantics home_menu_usuario; fallback coord)
            - runFlow:
                when:
                  visible:
                    id: "home_menu_usuario"
                commands:
                  - tapOn:
                      id: "home_menu_usuario"
            - runFlow:
                when:
                  notVisible:
                    id: "home_menu_usuario"
                commands:
                  - tapOn:
                      point: "28%, 10%"
            - runFlow:
                when:
                  notVisible: "Sair|Perfil|Tutorial"
                commands:
                  - tapOn:
                      point: "10%, 10%"
                  - waitForAnimationToEnd:
                      timeout: 500
            - extendedWaitUntil:
                visible: "Sair|home_menu_sair"
                timeout: 8000
            # Item Sair (Semantics home_menu_sair; fallback texto)
            - runFlow:
                when:
                  visible:
                    id: "home_menu_sair"
                commands:
                  - tapOn:
                      id: "home_menu_sair"
            - runFlow:
                when:
                  notVisible:
                    id: "home_menu_sair"
                  visible: "Sair"
                commands:
                  - tapOn: "Sair"
            # Diálogo confirmar sair
            - runFlow:
                when:
                  visible:
                    id: "home_dialog_sair_confirmar"
                commands:
                  - tapOn:
                      id: "home_dialog_sair_confirmar"
            - runFlow:
                when:
                  notVisible:
                    id: "home_dialog_sair_confirmar"
                  visible: "Tem certeza que deseja sair do aplicativo?"
                commands:
                  - tapOn: "Sair"
            - extendedWaitUntil:
                visible: "ENTRAR"
                timeout: 12000
