# Logout → ENTRAR via menu do usuário (NÃO drawer).
# Idempotente: se já estiver em ENTRAR, não faz nada.
#
# CARDÁPIO no loop de Back = home de PHJESUS em SUPORTE (não prova outro perfil).

appId: br.com.polygonus.mobile.amostra
---
- runFlow:
    when:
      visible: "ENTRAR"
    commands:
      - assertVisible: "ENTRAR"

- runFlow:
    when:
      notVisible: "ENTRAR"
    commands:
      - runFlow:
          when:
            visible: "Back"
          commands:
            - tapOn: "Back"
            - waitForAnimationToEnd
            - runFlow: ../mural/fechar_gravacao_pendente.yaml

      - repeat:
          times: 5
          commands:
            - runFlow:
                when:
                  notVisible: "ENTRAR|Pedro Jesus|Pedro|Ana|Bruno|Davi|CARDÁPIO|CARDAPIO"
                  visible: "Back|Show menu|Responder comunicado|Comunicado"
                commands:
                  - pressKey: Back
                  - waitForAnimationToEnd
                  - runFlow: ../mural/fechar_gravacao_pendente.yaml
                  - tapOn:
                      text: "CANCELAR"
                      optional: true
                  - tapOn:
                      text: "Cancelar"
                      optional: true

      - runFlow:
          when:
            visible: "PULAR"
          commands:
            - runFlow: ../nav/dismiss_coachmarks_pular.yaml

      - runFlow:
          when:
            visible: "ENTRAR"
          commands:
            - assertVisible: "ENTRAR"

      - runFlow:
          when:
            notVisible: "ENTRAR"
          commands:
            - extendedWaitUntil:
                visible: ".*MURAL.*|CARDÁPIO|CARDAPIO|Pedro Jesus|Pedro|Ana|Bruno|Davi"
                timeout: 12000
            - waitForAnimationToEnd
            # Menu do usuário — qualquer nome no header (PHJESUS, ETMENEZES, …)
            - tapOn:
                point: "28%, 10%"
            - runFlow:
                when:
                  notVisible: "Sair|Perfil|Tutorial"
                commands:
                  - tapOn:
                      point: "10%, 10%"
                  - waitForAnimationToEnd
            - extendedWaitUntil:
                visible: "Sair"
                timeout: 8000
            - tapOn: "Sair"
            - runFlow:
                when:
                  visible: "Tem certeza que deseja sair do aplicativo?"
                commands:
                  - tapOn: "Sair"
            - extendedWaitUntil:
                visible: "ENTRAR"
                timeout: 12000
