# Estabelece sessão PHJESUS + COORDENADOR sem logout/login desnecessário.
#
# Sessão persistida:
#   PHJESUS — header: Pedro Jesus
#   ETMENEZES (responsável / Eliza) — SEMPRE RESPONSAVEIS; NÃO trocar perfil.
#     Detectar: Eliza|Teixeira|filhos Bruno|Davi|Ana|RESPONSAVEIS na tela Perfil
#   ACMENEZES (aluno) — header: só "Ana"
# Se outro usuário estiver logado → logout + login PHJESUS.
# Nunca chamar garantir_perfil_* enquanto a sessão for ETMENEZES.

appId: br.com.polygonus.mobile.amostra
---
- launchApp
- waitForAnimationToEnd:
    timeout: 8000

# Picker residual (DocumentsUI) — Back até a home/login aparecer.
# Não Back no splash (logo Colégio Polygonus): isso manda o app para o launcher.
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible: "Show roots|Recent|Downloads|Files|Allow|WHILE USING|While using|Open from|Abrir de|Audio|Videos"
          commands:
            - pressKey: Back
            - waitForAnimationToEnd:
                timeout: 500

- runFlow:
    when:
      notVisible: "PULAR|ENTRAR|FAZER LOGIN|Pedro Jesus|Pedro|Eliza|Teixeira|Ana|Bruno|Davi|Show menu|Responder comunicado|.*MURAL.*|CARDÁPIO|CARDAPIO|Colégio Polygonus|Mensalidades em aberto|Agora não"
    commands:
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 800
      - waitForAnimationToEnd:
          timeout: 2500

- extendedWaitUntil:
    visible: "PULAR|ENTRAR|FAZER LOGIN|Pedro Jesus|Pedro|Eliza|Teixeira|Ana|Bruno|Davi|Show menu|Responder comunicado|Mural da Rotina|Selecionar|Versão|RESPONSAVEIS|.*MURAL.*|CARDÁPIO|CARDAPIO|Colégio Polygonus|.*Acompanhe de perto.*|Confira o rendimento|Comece a usar|Mensalidades em aberto|Agora não"
    timeout: 45000

- runFlow: ../nav/dismiss_pendencia_dialog.yaml

# 1ª instalação — no-op se já logado (sem botão avancar)
- runFlow: dismiss_onboarding_primeira_instalacao.yaml

- runFlow: ../nav/dismiss_coachmarks_pular.yaml

- runFlow:
    when:
      visible: "FAZER LOGIN"
    commands:
      - runFlow: ../helpers/tap_fazer_login.yaml

# Sai do Mural (lista) se não for Pedro
- runFlow:
    when:
      visible: "Show menu|Responder comunicado"
      notVisible: "Pedro Jesus|Pedro"
    commands:
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 500
      - runFlow: ../nav/dismiss_coachmarks_pular.yaml

# Já na tela Perfil da Eliza (responsável) — NÃO tocar no dropdown; voltar e trocar usuário
- runFlow:
    when:
      visible: "RESPONSAVEIS|Eliza|Teixeira"
      notVisible: "Pedro Jesus|Pedro|ENTRAR"
    commands:
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 500
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 500
      - runFlow: ../nav/dismiss_coachmarks_pular.yaml
      - runFlow: logout.yaml
      - runFlow:
          file: login_as.yaml
          env:
            LOGIN: ${LOGIN_PHJESUS}
            SENHA: ${SENHA}
            NOME_USUARIO: "Pedro Jesus|Pedro|.*MURAL.*"

# ETMENEZES na home — header Eliza e/ou filhos (não só Ana isolada)
- runFlow:
    when:
      visible: "Eliza|Teixeira|Bruno|Davi"
      notVisible: "Pedro Jesus|Pedro|ENTRAR"
    commands:
      - runFlow: ../nav/dismiss_coachmarks_pular.yaml
      - runFlow: logout.yaml
      - runFlow:
          file: login_as.yaml
          env:
            LOGIN: ${LOGIN_PHJESUS}
            SENHA: ${SENHA}
            NOME_USUARIO: "Pedro Jesus|Pedro|.*MURAL.*"

# ACMENEZES = aluno — header só o nome da aluna (Ana), sem Bruno/Davi/Eliza
- runFlow:
    when:
      visible: "Ana"
      notVisible: "Bruno|Davi|Eliza|Teixeira|Pedro Jesus|Pedro|ENTRAR"
    commands:
      - runFlow: logout.yaml
      - runFlow:
          file: login_as.yaml
          env:
            LOGIN: ${LOGIN_PHJESUS}
            SENHA: ${SENHA}
            NOME_USUARIO: "Pedro Jesus|Pedro|.*MURAL.*"

- runFlow:
    when:
      visible: "ENTRAR"
    commands:
      - runFlow:
          file: login_as.yaml
          env:
            LOGIN: ${LOGIN_PHJESUS}
            SENHA: ${SENHA}
            NOME_USUARIO: "Pedro Jesus|Pedro|.*MURAL.*"

# Gate: ainda sem Pedro → outro usuário (ex.: Eliza sem texto Eliza no tree) → logout + login
- runFlow:
    when:
      notVisible: "ENTRAR|Pedro Jesus|Pedro"
    commands:
      - runFlow: logout.yaml
      - runFlow:
          file: login_as.yaml
          env:
            LOGIN: ${LOGIN_PHJESUS}
            SENHA: ${SENHA}
            NOME_USUARIO: "Pedro Jesus|Pedro|.*MURAL.*"

- extendedWaitUntil:
    visible: "Pedro Jesus|Pedro"
    timeout: 25000

- runFlow: ../nav/dismiss_pendencia_dialog.yaml

# Só agora — PHJESUS confirmado; ETMENEZES nunca chega aqui
- runFlow: ../perfil/garantir_perfil_coordenador.yaml
