# Teardown leve — volta à home autenticada (card da home), SEM logout.
# Próximo CT: resume_phjesus_coordenador (troca ETMENEZES → PHJESUS se precisar).
#
# NÃO use só ".*MURAL.*" — dentro do feed a aba inferior "Mural" casa e o
# teardown acha que já está na home (fica em Recebidas/Enviadas).
#
# Atenção Maestro/YAML: NÃO repetir a chave `notVisible` no mesmo `when`
# (a 2ª sobrescreve a 1ª). Dois critérios = dois `runFlow` aninhados.

appId: br.com.polygonus.mobile.amostra
---
# Já na home (card da grade) → só valida e sai
- runFlow:
    when:
      visible:
        id: "home_card_mural"
    commands:
      - assertNotVisible: "Show menu|Responder comunicado"

# Ainda na lista do Mural → sair com Back
- runFlow:
    when:
      notVisible:
        id: "home_card_mural"
    commands:
      - runFlow:
          when:
            visible: "Show menu|Recebidas|Enviadas|Pendentes|Responder comunicado"
          commands:
            - runFlow: ../nav/voltar_home_apos_mural.yaml

      # Overlay / tela interna sem lista e sem card da home
      - runFlow:
          when:
            notVisible:
              id: "home_card_mural"
          commands:
            - runFlow: ../nav/voltar_para_home.yaml

# Home = card MURAL da grade (não a aba do feed)
- extendedWaitUntil:
    visible:
      id: "home_card_mural"
    timeout: 15000

- assertVisible:
    id: "home_card_mural"

- assertNotVisible: "Show menu|Responder comunicado"
