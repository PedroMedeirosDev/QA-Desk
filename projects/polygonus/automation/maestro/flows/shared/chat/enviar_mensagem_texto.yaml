# Stub → happy path texto (Atendimento novo).
# Build ≥ 6.06.23: chat_lista_item_* → chat_input_texto + chat_input_enviar_ou_mic
# Env: CHAT_TEXTO

appId: br.com.polygonus.mobile.amostra
---
# Se ainda na lista, abre a 1ª conversa
- runFlow:
    when:
      visible:
        id: "chat_lista_item_0"
      notVisible:
        id: "chat_input_texto"
    commands:
      - tapOn:
          id: "chat_lista_item_0"
      - waitForAnimationToEnd:
          timeout: 1500

- runFlow:
    when:
      visible:
        id: "chat_input_texto"
    commands:
      - tapOn:
          id: "chat_input_texto"
      - inputText: "${CHAT_TEXTO}"
      - runFlow:
          when:
            visible:
              id: "chat_input_enviar_ou_mic"
          commands:
            - tapOn:
                id: "chat_input_enviar_ou_mic"
      - runFlow:
          when:
            notVisible:
              id: "chat_input_enviar_ou_mic"
            visible:
              id: "chat_input_enviar"
          commands:
            - tapOn:
                id: "chat_input_enviar"
      - waitForAnimationToEnd:
          timeout: 2000
      # Composer continua; corpo da msg pode ser canvas
      - assertVisible:
          id: "chat_input_texto"

# Fallback texto (flaky) — só se o id ainda não existir
- runFlow:
    when:
      notVisible:
        id: "chat_input_texto"
      visible: "Escreva|Digite|Mensagem|Enviar"
    commands:
      - tapOn: "Escreva|Digite|Mensagem"
      - inputText: "${CHAT_TEXTO}"
      - tapOn: "Enviar"
      - waitForAnimationToEnd:
          timeout: 2000

# Falha explícita se não abriu composer
- runFlow:
    when:
      notVisible:
        id: "chat_input_texto"
      notVisible: "Escreva|Digite|Mensagem"
    commands:
      - assertVisible:
          id: "chat_input_texto"
