# Tap por id; fallback em coordenada SÓ se AFTER_VISIBLE não aparecer.
#
# Env: SEM_ID, FALLBACK_POINT, AFTER_VISIBLE

appId: br.com.polygonus.mobile.amostra
---
- tapOn:
    id: "${SEM_ID}"
    optional: true

- waitForAnimationToEnd:
    timeout: 500
- runFlow:
    when:
      notVisible: "${AFTER_VISIBLE}"
    commands:
      - tapOn:
          point: "${FALLBACK_POINT}"
