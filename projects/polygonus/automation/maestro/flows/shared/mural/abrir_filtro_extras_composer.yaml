# Ícone de filtro (funil) no app bar do composer — superior direita.
# Abre o menu de filtros extras (Inadimplentes, Adimplentes, Bolsistas, …).

appId: br.com.polygonus.mobile.amostra
---
- assertVisible: "Novo comunicado|Novo evento|Para:"

- tapOn:
    text: "Filtrar|Filter|Show filter|Filtros"
    optional: true

- runFlow:
    when:
      notVisible: "Inadimplentes|Inadimplente|Adimplentes|Adimplente|Pagantes|Pagante|Bolsista|bolsista|faltas|média|media|Limpar filtro|Período|Periodo"
    commands:
      # Funil no canto superior direito (app bar)
      - tapOn:
          point: "92%, 7%"
      - waitForAnimationToEnd:
          timeout: 500

- extendedWaitUntil:
    visible: "Inadimplentes|Inadimplente|Adimplentes|Adimplente|Pagantes|Pagante|Bolsista|bolsista|faltas|média|media|Limpar|Filtro|Período|Periodo"
    timeout: 6000
