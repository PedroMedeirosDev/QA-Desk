# Abre o menu ⋮ do comunicado mais recente em Enviadas.
# Grava output.idComunicado antes de abrir o menu (ou usa ID já seedado).
#
# Editar/Excluir SÓ existem no ⋮ de Enviadas (em Recebidas só anexos).

appId: br.com.polygonus.mobile.amostra
---
# 1) Garantir lista Enviadas
- runFlow:
    when:
      notVisible: "Enviadas|Enviados"
    file: filtrar_enviadas.yaml

- assertVisible: "Enviadas|Enviados"

- runFlow: aguardar_lista_mural_carregada.yaml

- runFlow:
    file: seed_id_comunicado_env.yaml
    env:
      ID_COMUNICADO: ${ID_COMUNICADO}
      MURAL_ID: ${MURAL_ID}

- runFlow:
    when:
      true: ${!(output.idComunicado && String(output.idComunicado).length > 3)}
    file: capturar_id_ultimo_comunicado.yaml
    env:
      ID_COMUNICADO: ${ID_COMUNICADO}
      MURAL_ID: ${MURAL_ID}

- assertTrue: ${(output.idComunicado || "").length > 3}

# 2) ⋮ do topo em Enviadas → Editar|Excluir
- runFlow: abrir_menu_enviadas_topo.yaml
