# Aguarda compressão de vídeo só se o progresso (ou o toast) estiver na tela.
# Pronto quando aparecer: "Video comprimido com sucesso!"
# Poll em fatias de 5s — cada COMPLETED renova o idle da qa-app.

appId: br.com.polygonus.mobile.amostra
---
- runFlow:
    when:
      visible: "Compressão em andamento|aguardar o término da compressão|compressão dos vídeos|Video comprimido com sucesso!|Vídeo comprimido com sucesso!"
    commands:
      - evalScript: "${output.videoComprimidoOk = false}"

      - runFlow:
          when:
            visible: "Video comprimido com sucesso!|Vídeo comprimido com sucesso!|.*comprimido com sucesso.*"
          commands:
            - evalScript: "${output.videoComprimidoOk = true}"

      - repeat:
          times: 36
          commands:
            - runFlow:
                when:
                  visible: "Video comprimido com sucesso!|Vídeo comprimido com sucesso!|.*comprimido com sucesso.*"
                commands:
                  - evalScript: "${output.videoComprimidoOk = true}"
            - runFlow:
                when:
                  true: ${!output.videoComprimidoOk}
                commands:
                  - waitForAnimationToEnd:
                      timeout: 5000

      - extendedWaitUntil:
          visible: "Video comprimido com sucesso!|Vídeo comprimido com sucesso!|.*comprimido com sucesso.*"
          timeout: 15000

      - waitForAnimationToEnd:
          timeout: 500
      - tapOn:
          text: "Ok|OK|Fechar"
          optional: true
      - waitForAnimationToEnd:
          timeout: 400
