# Aguarda compressao de video no composer (ANEXO-03).
#
# Gate: texto/content-desc "Comprimindo" sumir.
# Sem acentos problematicos; sem regex .* (Maestro + content-desc).
# Se o overlay nao aparecer na a11y, enviar_comunicado faz retry no alerta.
#
# Env:
#   ESPERAR_TOAST_VIDEO=1  → apos anexar: poll ate Comprimindo sumir (12 min)

appId: br.com.polygonus.mobile.amostra
---
- runFlow:
    when:
      visible: "Compressao em andamento|Compressão em andamento|necessario aguardar|É necessário aguardar"
    commands:
      - tapOn: "Fechar"
      - waitForAnimationToEnd:
          timeout: 500

- runFlow:
    when:
      true: ${ESPERAR_TOAST_VIDEO}
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      # Poll: enquanto "Comprimindo" estiver visivel, espera (max ~12 min)
      - repeat:
          times: 72
          while:
            visible: "Comprimindo"
          commands:
            - waitForAnimationToEnd:
                timeout: 10000
      - runFlow:
          when:
            visible: "comprimido com sucesso"
          commands:
            - tapOn:
                text: "Ok|OK|Fechar"
                optional: true
            - waitForAnimationToEnd:
                timeout: 400

- runFlow:
    when:
      visible: "Comprimindo"
    commands:
      - repeat:
          times: 72
          while:
            visible: "Comprimindo"
          commands:
            - waitForAnimationToEnd:
                timeout: 10000

- runFlow:
    when:
      visible: "Compressao em andamento|Compressão em andamento|necessario aguardar|É necessário aguardar"
    commands:
      - tapOn: "Fechar"
      - waitForAnimationToEnd:
          timeout: 400
