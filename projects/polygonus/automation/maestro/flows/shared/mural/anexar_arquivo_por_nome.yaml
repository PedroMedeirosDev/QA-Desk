# Clipe → Arquivo → picker nativo pelo nome (PDF, vídeo, etc.).
#
# Env obrigatório:
#   ANEXO_NOME — ex.: PDF TESTE.pdf / Video_teste.mp4 (nome no device)
#
# Env opcional:
#   ANEXO_PASTA — Download | Movies | Pictures
#
# Pré-requisito: arquivo no device (adb push em /sdcard/Download).

appId: br.com.polygonus.mobile.amostra
---
- runFlow: abrir_menu_anexo_clip.yaml

# Menu do clipe: "Selecionar arquivo" (não "Arquivo").
- tapOn: "Selecionar arquivo"
- waitForAnimationToEnd:
    timeout: 500
- extendedWaitUntil:
    visible: "Images|Recent|Downloads|Download|Documents|Show roots|${ANEXO_NOME}|Abrir|Open"
    timeout: 12000

# Navegar no drawer do DocumentsUI (Recent sozinho quase nunca lista o PDF)
- tapOn:
    text: "Show roots"
    optional: true
- waitForAnimationToEnd:
    timeout: 400
- tapOn:
    text: "${ANEXO_PASTA}"
    optional: true
- tapOn:
    text: "Downloads"
    optional: true
- tapOn:
    text: "Download"
    optional: true
- tapOn:
    text: "Movies"
    optional: true
- tapOn:
    text: "Filmes"
    optional: true
- tapOn:
    text: "Pictures"
    optional: true
- tapOn:
    text: "Imagens"
    optional: true
- tapOn:
    text: "Documents"
    optional: true
- waitForAnimationToEnd:
    timeout: 400

- scrollUntilVisible:
    element: "${ANEXO_NOME}"
    direction: DOWN
    timeout: 12000
    optional: true

- tapOn: "${ANEXO_NOME}"

- tapOn:
    text: "Abrir"
    optional: true
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Selecionar"
    optional: true
- waitForAnimationToEnd:
    timeout: 500
- extendedWaitUntil:
    visible: "Novo comunicado|Editar comunicado|Para:|Escreva seu texto aqui"
    timeout: 10000
