# Copia o badge "ID 123456" do card na lista (Enviadas/Recebidas).
#
# Preferência: copyTextFrom do 1º mural_card_menu (lista atual).
# Env ID_COMUNICADO / MURAL_ID só se o copy falhar (pipeline qa-desk/adb).
# NÃO fixar ID_COMUNICADO no .env — fica velho e ancora o ⋮ no card errado.

appId: br.com.polygonus.mobile.amostra
---
- evalScript: |
    ${(() => {
      var t = "";
      try {
        if (typeof TEXTO_ANCORAGEM !== "undefined" && TEXTO_ANCORAGEM) {
          t = String(TEXTO_ANCORAGEM).trim();
        }
      } catch (e) {}
      output.textoAncoragem = (t && t !== "undefined") ? t : "";
      output.hasTextoAncoragem = output.textoAncoragem.length > 2;
    })()}

# 1) ID do card visível (sempre tenta — evita ID velho do .env)
- copyTextFrom:
    id: "mural_card_menu"
    index: 0
    optional: true
- evalScript: '${output.idComunicado = ((maestro.copiedText || "").match(/ID\\s*[0-9]+/) || [])[0] || ""}'
- copyTextFrom:
    text: "ID [0-9]+"
    index: 0
    optional: true
- evalScript: |
    ${(() => {
      var fromCopy = ((maestro.copiedText || "").match(/ID\s*[0-9]+/) || [])[0] || "";
      if (fromCopy) output.idComunicado = fromCopy;
      if (output.idComunicado && String(output.idComunicado).indexOf("ID") < 0) {
        output.idComunicado = "ID " + String(output.idComunicado).trim();
      }
    })()}

# 2) Fallback: env (qa-desk injeta após adb)
- runFlow:
    when:
      true: ${!(output.idComunicado && String(output.idComunicado).length > 3)}
    file: seed_id_comunicado_env.yaml
    env:
      ID_COMUNICADO: ${ID_COMUNICADO}
      MURAL_ID: ${MURAL_ID}

- evalScript: |
    ${(() => {
      output.hasIdComunicado = !!(output.idComunicado && String(output.idComunicado).length > 3);
    })()}

# Sem ID: aba Mural + pull-to-refresh (anexo atrasa a lista) + texto
- runFlow:
    when:
      true: ${!output.hasIdComunicado && output.hasTextoAncoragem}
    commands:
      - tapOn:
          text: "Mural | Tab 1 of 2"
          optional: true
      - tapOn:
          text: "Mural"
          optional: true
      - swipe:
          start: "50%, 28%"
          end: "50%, 72%"
          duration: 400
      - waitForAnimationToEnd:
          timeout: 500
      - swipe:
          start: "50%, 28%"
          end: "50%, 72%"
          duration: 400
      - waitForAnimationToEnd:
          timeout: 500
      - scrollUntilVisible:
          element:
            text: ${output.textoAncoragem}
          direction: DOWN
          timeout: 20000
          optional: true
      - scrollUntilVisible:
          element:
            text: ${output.textoAncoragem}
          direction: UP
          timeout: 8000
          optional: true
      - extendedWaitUntil:
          visible: ${output.textoAncoragem}
          timeout: 25000
      - assertVisible: ".*ID\\s*[0-9]+.*"
      - copyTextFrom:
          text: "ID [0-9]+"
          index: 0
          optional: true
      - evalScript: '${output.idComunicado = ((maestro.copiedText || "").match(/ID\\s*[0-9]+/) || [])[0] || output.idComunicado || ""}'
      - evalScript: '${output.hasIdComunicado = !!(output.idComunicado && String(output.idComunicado).length > 3)}'

- assertTrue: ${output.hasIdComunicado || output.hasTextoAncoragem}
