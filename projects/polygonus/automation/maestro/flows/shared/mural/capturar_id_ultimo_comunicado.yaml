# Captura o ID do primeiro card visível (mais recente em Enviadas).
# Pré-requisito: lista Enviadas já filtrada.
#
# ID numérico: qa-app injeta env ID_COMUNICADO após prep_lista_enviadas + adb
# (copyTextFrom não lê content-desc do badge; uiautomator conflita com Maestro).

appId: br.com.polygonus.mobile.amostra
---
- runFlow: aguardar_lista_mural_carregada.yaml

- extendedWaitUntil:
    visible:
      id: "mural_card_menu"
    timeout: 10000

- runFlow:
    file: capturar_id_comunicado_lista.yaml
    env:
      ID_COMUNICADO: ${ID_COMUNICADO}
      MURAL_ID: ${MURAL_ID}
