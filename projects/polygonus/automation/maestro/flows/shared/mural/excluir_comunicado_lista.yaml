# Exclui o comunicado mais recente em Enviadas (por ID, sem texto fixo).
#
# Env: ID_COMUNICADO / MURAL_ID; SKIP_FILTRAR_ENVIADAS (Pipeline qa-desk)
#
# Fluxo: Enviadas → ⋮ (mural_card_menu) → Excluir → confirmar Sim → ID some.
# Grava output.idComunicadoAntes; após excluir confirma que o ID sumiu.

appId: br.com.polygonus.mobile.amostra
---
- runFlow:
    file: seed_id_comunicado_env.yaml
    env:
      ID_COMUNICADO: ${ID_COMUNICADO}
      MURAL_ID: ${MURAL_ID}

- runFlow:
    file: abrir_menu_ultimo_comunicado.yaml
    env:
      ID_COMUNICADO: ${ID_COMUNICADO}
      MURAL_ID: ${MURAL_ID}
      SKIP_FILTRAR_ENVIADAS: ${SKIP_FILTRAR_ENVIADAS}

- evalScript: '${output.idComunicadoAntes = output.idComunicado}'

- runFlow:
    file: tap_acao_menu_card.yaml
    env:
      MENU_ACAO: "Excluir"

- runFlow: confirmar_exclusao_comunicado.yaml

- runFlow:
    file: assert_comunicado_ausente_por_id.yaml
    env:
      ID_COMUNICADO: ${ID_COMUNICADO}
      MURAL_ID: ${MURAL_ID}
