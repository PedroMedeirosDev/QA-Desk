# Descarta rascunho ao sair do composer (diálogo "Gravação Pendente").
# Só o título do dialog — textos genéricos geram falso "Sim" na lista.

appId: br.com.polygonus.mobile.amostra
---
- runFlow:
    when:
      visible: "Gravação Pendente"
    commands:
      - tapOn: "Sim"
      - waitForAnimationToEnd:
          timeout: 500
