# Liga o toggle "Dia inteiro" no composer de Evento.
#
# Semantics: mural_evento_dia_inteiro (app ≥ 6.06.10).
# Fallback: rightOf + below/above (NUNCA rightOf sozinho — pega o olho do app bar).

appId: br.com.polygonus.mobile.amostra
---
- scrollUntilVisible:
    element: "Dia inteiro|Dia Inteiro"
    direction: DOWN
    timeout: 8000
    optional: true

- extendedWaitUntil:
    visible: "Dia inteiro|Dia Inteiro"
    timeout: 8000

# Preferência: semantics no Switch
- runFlow:
    when:
      visible:
        id: "mural_evento_dia_inteiro"
    commands:
      - tapOn:
          id: "mural_evento_dia_inteiro"
      - waitForAnimationToEnd:
          timeout: 500

# Fallback: à direita do rótulo, entre Título e corpo (fora do app bar / olho)
- runFlow:
    when:
      notVisible:
        id: "mural_evento_dia_inteiro"
      visible: "Título do evento|Titulo do evento"
    commands:
      - tapOn:
          rightOf: "Dia inteiro"
          below: "Título do evento|Titulo do evento"
          above: "Escreva seu texto aqui"
      - waitForAnimationToEnd:
          timeout: 600

- runFlow:
    when:
      notVisible:
        id: "mural_evento_dia_inteiro"
      visible: "Escreva seu texto aqui"
      notVisible: "Título do evento|Titulo do evento"
    commands:
      - tapOn:
          rightOf: "Dia inteiro"
          below: "Para:"
          above: "Escreva seu texto aqui"
      - waitForAnimationToEnd:
          timeout: 600

# Se abriu pré-visualização (olho) → Back e retenta
- runFlow:
    when:
      notVisible: "Para:|Dia inteiro|Escreva seu texto aqui"
    commands:
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 500
      - extendedWaitUntil:
          visible: "Dia inteiro|Dia Inteiro|Para:"
          timeout: 8000
      - runFlow:
          when:
            visible:
              id: "mural_evento_dia_inteiro"
          commands:
            - tapOn:
                id: "mural_evento_dia_inteiro"
            - waitForAnimationToEnd:
                timeout: 500
      - runFlow:
          when:
            notVisible:
              id: "mural_evento_dia_inteiro"
          commands:
            - tapOn:
                point: "92%, 38%"
            - waitForAnimationToEnd:
                timeout: 600

- assertVisible: "Novo evento|Para:"

# Horários ainda nas datas → Switch OFF → segundo toque
- runFlow:
    when:
      visible: "2026 \\d{1,2}:\\d{2}"
    commands:
      - runFlow:
          when:
            visible:
              id: "mural_evento_dia_inteiro"
          commands:
            - tapOn:
                id: "mural_evento_dia_inteiro"
            - waitForAnimationToEnd:
                timeout: 600
      - runFlow:
          when:
            notVisible:
              id: "mural_evento_dia_inteiro"
          commands:
            - tapOn:
                rightOf: "Dia inteiro"
                below: "Título do evento|Titulo do evento|Para:"
                above: "Escreva seu texto aqui"
                optional: true
            - waitForAnimationToEnd:
                timeout: 600

- assertVisible: "Novo evento|Para:"
- scrollUntilVisible:
    element: "Escreva seu texto aqui|Título do evento|Titulo do evento"
    direction: UP
    timeout: 5000
    optional: true
