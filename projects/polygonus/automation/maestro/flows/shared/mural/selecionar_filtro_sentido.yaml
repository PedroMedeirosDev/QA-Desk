# Seleciona filtro TipoSentido no header.
#
# Env:
#   FILTRO     — regex do valor no header (ex.: Enviadas|Enviados)
#   FILTRO_TAP — regex do item no menu (ex.: Enviadas|Enviados)
#   FILTRO_SENTIDO_ID — default mural_filtro_sentido
#     Na aba Rotina (≥ 6.06.22): rotina_filtro_sentido
#     (TabBarView monta as duas abas — ids iguais quebravam o tap no Maestro)
#
# Antes do tap: garante aba Mural se o id for o do mural (evita nó da Rotina).

appId: br.com.polygonus.mobile.amostra
---
- evalScript: |
    ${(() => {
      if (!output.filtroSentidoId || String(output.filtroSentidoId).length < 3) {
        var fromEnv = "";
        try {
          if (typeof FILTRO_SENTIDO_ID !== "undefined" && FILTRO_SENTIDO_ID) {
            fromEnv = String(FILTRO_SENTIDO_ID).trim();
          }
        } catch (e) {}
        output.filtroSentidoId = fromEnv.length > 0 ? fromEnv : "mural_filtro_sentido";
      }
    })()}

- waitForAnimationToEnd:
    timeout: 500
- extendedWaitUntil:
    visible: "Back"
    timeout: 8000

# Se vamos usar o id do Mural, ancora a aba Comunicados (não Rotina)
- runFlow:
    when:
      true: ${output.filtroSentidoId == "mural_filtro_sentido"}
      visible:
        id: "mural_tab_mural"
    commands:
      - tapOn:
          id: "mural_tab_mural"
      - waitForAnimationToEnd:
          timeout: 400

- runFlow:
    when:
      true: ${output.filtroSentidoId == "rotina_filtro_sentido"}
      visible:
        id: "mural_tab_rotina"
    commands:
      - tapOn:
          id: "mural_tab_rotina"
      - waitForAnimationToEnd:
          timeout: 400

- extendedWaitUntil:
    visible:
      id: ${output.filtroSentidoId}
    timeout: 8000

# Já no filtro certo
- runFlow:
    when:
      visible: "${FILTRO}"
    commands:
      - assertVisible: "${FILTRO}"

# Trocar filtro.
# Build com semanticsItemId: cada opção vira resource-id `*_item` e o texto
# acessível fica "Enviadas\nEnviadas" (label + Text). O matcher de texto
# simples (Enviadas|Enviados) não casa — usar id + índice.
- runFlow:
    when:
      notVisible: "${FILTRO}"
    commands:
      - evalScript: |
          ${(() => {
            output.filtroItemId = String(output.filtroSentidoId || "mural_filtro_sentido") + "_item";
          })()}
      - tapOn:
          text: "Recebidas|Recebidos|Enviadas|Enviados|Pendentes|Aprovadas"
          rightOf: "Back"
          optional: true
      - waitForAnimationToEnd:
          timeout: 500
      - runFlow:
          when:
            notVisible:
              id: ${output.filtroItemId}
          commands:
            - tapOn:
                id: ${output.filtroSentidoId}
            - waitForAnimationToEnd:
                timeout: 500
      - extendedWaitUntil:
          visible:
            id: ${output.filtroItemId}
          timeout: 10000
      # Itens têm resource-id, mas clickable=false e text vazio (só
      # accessibilityText "Enviadas\nEnviadas"). Maestro não acha por texto
      # nem por id+index. No Medium_Phone 1080x2400 o 2º item (Enviadas)
      # cai em ~43%,14% — ver dump do overlay TipoSentidoDropdown.
      - runFlow:
          when:
            true: ${/enviad/i.test(String(FILTRO_TAP || FILTRO || ""))}
          commands:
            - tapOn:
                point: "43%,14%"
      - runFlow:
          when:
            true: ${/pendente/i.test(String(FILTRO_TAP || FILTRO || ""))}
          commands:
            - tapOn:
                point: "43%,19%"
      - runFlow:
          when:
            true: ${/aprovad/i.test(String(FILTRO_TAP || FILTRO || ""))}
          commands:
            - tapOn:
                point: "43%,24%"
      - waitForAnimationToEnd:
          timeout: 500
      - runFlow: fechar_dropdown_filtro_sentido.yaml

- extendedWaitUntil:
    visible: "Show menu|Responder comunicado|${FILTRO}"
    timeout: 10000

- assertVisible: "${FILTRO}"
