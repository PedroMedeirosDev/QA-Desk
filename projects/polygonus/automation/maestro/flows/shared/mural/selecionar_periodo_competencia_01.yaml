# Dialog "Período": NÃO marca mês corrente.
# Clica na data abaixo de "Período" → lista de competências → item com "01" → Ok.

appId: br.com.polygonus.mobile.amostra
---
- extendedWaitUntil:
    visible: "Período|Periodo"
    timeout: 8000

# Primeira data (MM/AAAA) abaixo do rótulo Período — não a de "até"
- tapOn:
    text: "[0-9]{2}/[0-9]{4}"
    index: 0
    optional: true

- runFlow:
    when:
      notVisible: "01|.*01.*|/01"
    commands:
      - tapOn:
          text: "Período|Periodo"
          optional: true
      - tapOn:
          point: "35%, 42%"
      - waitForAnimationToEnd:
          timeout: 500
- extendedWaitUntil:
    visible: "01|.*01.*|01/"
    timeout: 8000

# Competência que contém "01" no texto
- tapOn: ".*01.*|01/|01 "
- waitForAnimationToEnd:
    timeout: 500
- tapOn: "Ok|OK"
- waitForAnimationToEnd:
    timeout: 500
- extendedWaitUntil:
    visible: "Novo comunicado|Editar comunicado|Para:|Escreva seu texto aqui"
    timeout: 10000
