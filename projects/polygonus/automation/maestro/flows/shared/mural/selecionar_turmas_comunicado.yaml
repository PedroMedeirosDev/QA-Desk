# Seleção de turmas no comunicado.
# Semantics: mural_composer_turma
#
# Env opcional:
#   SELECIONAR_TODAS_TURMAS=false + TURMA_MURAL para uma turma só

appId: br.com.polygonus.mobile.amostra
---
- tapOn:
    id: mural_composer_turma

- extendedWaitUntil:
    visible: "Procurar..."
    timeout: 5000

- runFlow:
    when:
      notVisible: "Procurar..."
    commands:
      - tapOn: "Turma"
      - extendedWaitUntil:
          visible: "Procurar..."
          timeout: 5000

- waitForAnimationToEnd:
    timeout: 500
- assertVisible: "Procurar..."

- tapOn:
    text: "Selecionar"
    optional: true
- tapOn:
    text: "Todos"
    optional: true

- tapOn:
    text: "${TURMA_MURAL}"
    optional: true

- tapOn: "OK"

- waitForAnimationToEnd:
    timeout: 500
- runFlow: fechar_menu_enquete_acidental.yaml

- assertVisible: "Escreva seu texto aqui"
