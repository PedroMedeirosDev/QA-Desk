# Toca uma ação do popup do ⋮ (Editar / Excluir / …).
#
# Env:
#   MENU_ACAO_ID — preferido (ex.: mural_card_editar, mural_card_excluir)
#   MENU_ACAO — texto/regex fallback (ex.: "Editar", "Excluir")
#
# Pré: lista Enviadas + popup do ⋮ aberto.

appId: br.com.polygonus.mobile.amostra
---
- assertTrue: ${((MENU_ACAO_ID || "").length > 0) || ((MENU_ACAO || "").length > 0)}

- runFlow:
    when:
      true: ${(MENU_ACAO_ID || "").length > 0}
    commands:
      - extendedWaitUntil:
          visible:
            id: ${MENU_ACAO_ID}
          timeout: 8000
      - tapOn:
          id: ${MENU_ACAO_ID}
      - waitForAnimationToEnd:
          timeout: 500

- runFlow:
    when:
      true: ${((MENU_ACAO_ID || "").length == 0) && ((MENU_ACAO || "").length > 0)}
    commands:
      - extendedWaitUntil:
          visible: ${MENU_ACAO}
          timeout: 8000
      - tapOn:
          text: ${MENU_ACAO}
      - waitForAnimationToEnd:
          timeout: 500
      - runFlow:
          when:
            visible: "Editar|Excluir|Compartilhar anexos|Salvar anexos"
          commands:
            - tapOn:
                text: ${MENU_ACAO}
            - waitForAnimationToEnd:
                timeout: 500
