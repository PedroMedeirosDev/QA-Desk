# Fecha coach marks (PULAR) só se estiver na tela.
# Semantics: home_coach_pular (app ≥ 6.06.10). Fallback: texto PULAR.

appId: br.com.polygonus.mobile.amostra
---
- runFlow:
    when:
      visible:
        id: "home_coach_pular"
    commands:
      - tapOn:
          id: "home_coach_pular"
      - waitForAnimationToEnd:
          timeout: 400
      - runFlow:
          when:
            visible:
              id: "home_coach_pular"
          commands:
            - tapOn:
                id: "home_coach_pular"
            - waitForAnimationToEnd:
                timeout: 400

- runFlow:
    when:
      visible: "PULAR"
      notVisible:
        id: "home_coach_pular"
    commands:
      - tapOn: "PULAR"
      - waitForAnimationToEnd:
          timeout: 400
      - runFlow:
          when:
            visible: "PULAR"
          commands:
            - tapOn: "PULAR"
            - waitForAnimationToEnd:
                timeout: 400
