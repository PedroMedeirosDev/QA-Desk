# Fecha coach marks (PULAR) só se estiver na tela.
# when:visible = checagem única (não espera); sem PULAR o flow pula na hora.
# Antes: 2× tap optional + wait sempre (~800ms+) mesmo sem coachmark.

appId: br.com.polygonus.mobile.amostra
---
- runFlow:
    when:
      visible: "PULAR"
    commands:
      - tapOn: "PULAR"
      - waitForAnimationToEnd:
          timeout: 400
      # Segundo coachmark residual (raro)
      - runFlow:
          when:
            visible: "PULAR"
          commands:
            - tapOn: "PULAR"
            - waitForAnimationToEnd:
                timeout: 400
