# Subflow: toca card na home.
# Env: CARD_HOME — texto do card (ex.: CONTEÚDO E FREQUÊNCIA) ou .*MURAL.*
#
# Semantics: home_card_mural quando o destino é o Mural.

appId: br.com.polygonus.mobile.amostra
---
- runFlow:
    when:
      visible:
        id: "home_card_mural"
    commands:
      - tapOn:
          id: "home_card_mural"

- runFlow:
    when:
      notVisible:
        id: "home_card_mural"
    commands:
      - tapOn: ${CARD_HOME}

- waitForAnimationToEnd
