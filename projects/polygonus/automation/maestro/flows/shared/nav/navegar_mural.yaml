# Subflow: navega da home até a aba "Mural" dentro da seção Mural.
# Pré-requisito: usuário já logado e na home (função com MURAL no menu).
#
# Após tap no home_card_mural o card some — NÃO usar "notVisible: home_card"
# como fallback (dispara 2º tap em .*MURAL.* / aba e reabre PULAR).

appId: br.com.polygonus.mobile.amostra
---
# Já na lista — não toca no card de novo
- runFlow:
    when:
      notVisible: "Show menu|Recebidas|Enviadas|Pendentes|Responder comunicado"
    commands:
      - runFlow:
          when:
            visible:
              id: "home_card_mural"
          commands:
            - tapOn:
                id: "home_card_mural"
            - waitForAnimationToEnd:
                timeout: 800

      # Fallback só se AINDA não entrou no feed (card ausente / home sem semantics)
      - runFlow:
          when:
            notVisible: "Show menu|Recebidas|Enviadas|Pendentes|Responder comunicado"
          commands:
            - tapOn: ".*MURAL.*"
            - waitForAnimationToEnd:
                timeout: 800

      - runFlow: dismiss_coachmarks_pular.yaml

# Aba Mural (bottom) — evita ficar na aba Rotina com cards Vestimenta/Humor
- runFlow:
    when:
      visible:
        id: "mural_tab_mural"
    commands:
      - tapOn:
          id: "mural_tab_mural"
          optional: true
- tapOn:
    text: "Mural | Tab 1 of 2"
    optional: true
- tapOn:
    text: "Mural"
    optional: true

- extendedWaitUntil:
    visible: ".*Recebidas.*|Enviados|Enviadas|Pendentes|Responder comunicado|Show menu"
    timeout: 12000

- runFlow: dismiss_coachmarks_pular.yaml
