# Subflow: navega da home até a aba "Mural" dentro da seção Mural.
# Pré-requisito: usuário já logado e na home (função com MURAL no menu).

appId: br.com.polygonus.mobile.amostra
---
# Já na lista — não toca no card de novo
- runFlow:
    when:
      notVisible: "Show menu|Recebidas|Enviadas|Pendentes|Responder comunicado"
    commands:
      - runFlow:
          when:
            visible:
              id: "home_card_mural"
          commands:
            - tapOn:
                id: "home_card_mural"

      - runFlow:
          when:
            notVisible:
              id: "home_card_mural"
          commands:
            - tapOn: ".*MURAL.*"

      - runFlow: dismiss_coachmarks_pular.yaml

# Aba Mural (bottom) — evita ficar na aba Rotina com cards Vestimenta/Humor
- tapOn:
    text: "Mural | Tab 1 of 2"
    optional: true
- tapOn:
    text: "Mural"
    optional: true

- extendedWaitUntil:
    visible: ".*Recebidas.*|Enviados|Enviadas|Pendentes|Responder comunicado|Show menu"
    timeout: 12000

- runFlow: dismiss_coachmarks_pular.yaml
