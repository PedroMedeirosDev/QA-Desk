# Subflow: home → Mural (módulo) → aba **Rotina** (não Comunicados).
# Pré-requisito: usuário logado na home
# Semantics: home_card_mural → mural_tab_rotina → rotina_boom_fab
#
# Comunicados usam mural_tab_mural / lista Recebidas|Enviadas.
# Rotina usa esta aba + rotina_boom_*.

appId: br.com.polygonus.mobile.amostra
---
- runFlow:
    file: navegar_mural.yaml

- runFlow:
    when:
      visible:
        id: "mural_tab_rotina"
    commands:
      - tapOn:
          id: "mural_tab_rotina"

- runFlow:
    when:
      notVisible:
        id: "mural_tab_rotina"
    commands:
      - tapOn: "Rotina"

- extendedWaitUntil:
    visible:
      id: "rotina_boom_fab"
    timeout: 10000

- assertVisible:
    id: "rotina_boom_fab"
