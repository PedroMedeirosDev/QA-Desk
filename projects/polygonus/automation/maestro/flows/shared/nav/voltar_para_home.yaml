# Volta à home autenticada a partir de telas internas.
#
# CARDÁPIO NÃO é home genérica — só indica PHJESUS em SUPORTE.
# Após CTs Mural (coordenador/professor), a home tem card MURAL.

appId: br.com.polygonus.mobile.amostra
---
- runFlow:
    when:
      notVisible: ".*MURAL.*"
    commands:
      - repeat:
          times: 5
          commands:
            - runFlow:
                when:
                  notVisible: ".*MURAL.*"
                commands:
                  - pressKey: Back
                  - waitForAnimationToEnd
      - runFlow:
          when:
            notVisible: ".*MURAL.*"
          commands:
            - launchApp
            - waitForAnimationToEnd

- extendedWaitUntil:
    visible: ".*MURAL.*"
    timeout: 15000
