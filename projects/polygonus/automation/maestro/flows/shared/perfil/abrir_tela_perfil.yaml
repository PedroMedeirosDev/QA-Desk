# Abre a tela Perfil pelo menu do usuário na home.
#
# Fluxo UI: tocar foto/nome → "Perfil"
# Labels Flutter: Unidade/Perfil/Ano podem vir agrupados em accessibilityText.

appId: br.com.polygonus.mobile.amostra
---
- runFlow:
    when:
      visible: "PULAR"
    commands:
      - runFlow: ../nav/dismiss_coachmarks_pular.yaml

# Home real — não confundir com tutorial "Mural em destaque" (também tem "MURAL")
- runFlow:
    when:
      visible:
        id: "home_menu_usuario"
    commands:
      - extendedWaitUntil:
          visible:
            id: "home_menu_usuario"
          timeout: 12000

- runFlow:
    when:
      notVisible:
        id: "home_menu_usuario"
    commands:
      - extendedWaitUntil:
          visible: "${NOME_USUARIO}"
          timeout: 12000

- assertNotVisible: "PULAR"

- waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: "home_menu_usuario"
    commands:
      - tapOn:
          id: "home_menu_usuario"

- runFlow:
    when:
      notVisible:
        id: "home_menu_usuario"
    commands:
      - tapOn:
          text: "${NOME_USUARIO}"
          optional: true
      - runFlow:
          when:
            notVisible: "Perfil"
          commands:
            - tapOn:
                text: "Pedro"
                optional: true
      - runFlow:
          when:
            notVisible: "Perfil"
          commands:
            - tapOn:
                point: "10%, 10%"
      - runFlow:
          when:
            notVisible: "Perfil"
          commands:
            - tapOn:
                point: "28%, 10%"

- extendedWaitUntil:
    visible: "Perfil"
    timeout: 8000

- tapOn: "Perfil"

- extendedWaitUntil:
    visible: ".*Unidade.*|SUPORTE|COORDENADOR|PROFESSORES|Versão.*"
    timeout: 12000
