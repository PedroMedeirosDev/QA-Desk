# Seleciona função no dropdown Perfil (só se ainda não estiver ativa).
#
# Env: FUNCAO — COORDENADOR | PROFESSORES | SUPORTE | …

appId: br.com.polygonus.mobile.amostra
---
- extendedWaitUntil:
    visible: ".*Unidade.*|Versão.*"
    timeout: 12000

# Já correto — volta à home
- runFlow:
    when:
      visible: "${FUNCAO}"
    commands:
      - pressKey: Back
      - extendedWaitUntil:
          visible: ".*MURAL.*"
          timeout: 12000

# Precisa trocar — só na tela Perfil (Unidade). Home com SUPORTE/CARDÁPIO não entra aqui.
- runFlow:
    when:
      notVisible: "${FUNCAO}"
      visible: ".*Unidade.*"
      notVisible: ".*MURAL.*"
    commands:
      - runFlow:
          when:
            visible:
              id: "perfil_dropdown_funcao"
          commands:
            - tapOn:
                id: "perfil_dropdown_funcao"
            - tapOn: "${FUNCAO}"
      - runFlow:
          when:
            notVisible:
              id: "perfil_dropdown_funcao"
          commands:
            - tapOn: "SUPORTE|PROFESSORES|SECRETARIA|RESPONSAVEIS|COORDENADOR"
            - tapOn: "${FUNCAO}"
      - extendedWaitUntil:
          visible: "${FUNCAO}"
          timeout: 12000
      - pressKey: Back
      - extendedWaitUntil:
          visible: ".*MURAL.*"
          timeout: 15000
