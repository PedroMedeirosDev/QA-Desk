# Seleciona função no dropdown Perfil (só se ainda não estiver ativa).
#
# Env: FUNCAO — COORDENADOR | PROFESSORES | SUPORTE | …
# Se o chip já mostra FUNCAO → só Back (NÃO abrir a lista).
# Só para PHJESUS. ETMENEZES/Eliza nunca usa este flow.

appId: br.com.polygonus.mobile.amostra
---
- extendedWaitUntil:
    visible: ".*Unidade.*|Versão.*"
    timeout: 12000

# Perfil: linha "Versao" + numero (pode nao vir no a11y tree). Nao bloquear o CT.
- assertVisible:
    text: "Vers.o"
    optional: true
- copyTextFrom:
    text: "Vers.o"
    optional: true
- evalScript: ${output.perfilVersao = String(maestro.copiedText || "").replace(/\s+/g, " ")}

# Sessão errada (responsável) — sair sem mexer no dropdown
- runFlow:
    when:
      visible: "RESPONSAVEIS|Eliza|Teixeira"
      notVisible: "COORDENADOR|PROFESSORES|SUPORTE|SECRETARIA|Pedro Jesus|Pedro"
    commands:
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 500
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 500

# Já no perfil certo — só voltar à home (não abrir lista / não retap)
- runFlow:
    when:
      visible: "${FUNCAO}"
    commands:
      - pressKey: Back
      - extendedWaitUntil:
          visible: ".*MURAL.*|Pedro Jesus|Pedro|home_card_mural"
          timeout: 15000

# Precisa trocar: ainda na tela Perfil E o alvo ainda não está selecionado
- runFlow:
    when:
      visible: ".*Unidade.*"
      notVisible: "${FUNCAO}|.*MURAL.*|RESPONSAVEIS|Eliza|Teixeira|Show menu|Recebidas"
    commands:
      - runFlow:
          when:
            visible:
              id: "perfil_dropdown_funcao"
          commands:
            - tapOn:
                id: "perfil_dropdown_funcao"
            - waitForAnimationToEnd:
                timeout: 800
      # Chip de OUTRO perfil (nunca tap no próprio FUNCAO — isso abre a lista à toa)
      - runFlow:
          when:
            notVisible:
              id: "perfil_dropdown_funcao"
            visible: "PROFESSORES|SUPORTE|SECRETARIA"
            notVisible: "${FUNCAO}"
          commands:
            - tapOn: "PROFESSORES|SUPORTE|SECRETARIA"
            - waitForAnimationToEnd:
                timeout: 800
      - extendedWaitUntil:
          visible: "${FUNCAO}"
          timeout: 12000
      - tapOn: "${FUNCAO}"
      - waitForAnimationToEnd:
          timeout: 500
      - pressKey: Back
      - extendedWaitUntil:
          visible: ".*MURAL.*|Pedro Jesus|Pedro|home_card_mural"
          timeout: 15000

# Safety: ainda em Perfil após os passos acima
- runFlow:
    when:
      visible: ".*Unidade.*|Versão.*"
      notVisible: ".*MURAL.*|Show menu|Recebidas|Enviadas"
    commands:
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 500
      - extendedWaitUntil:
          visible: ".*MURAL.*|Show menu|Pedro Jesus|Pedro|home_card_mural"
          timeout: 15000
