# Confirma PROFESSORES: Mural abre (Recebidas / feed).
# Não exige "Enviadas" isolado — no a11y o filtro pode mostrar só Recebidas/Enviados.
# Pendentes no dropdown de sentido é frágil; validação principal = card MURAL + lista.

appId: br.com.polygonus.mobile.amostra
---
- runFlow: ../nav/navegar_mural.yaml

- assertVisible: ".*Recebidas.*|Enviados|Enviadas|Pendentes|Responder comunicado|Show menu"

- pressKey: Back

- extendedWaitUntil:
    visible: ".*MURAL.*"
    timeout: 15000
