# Confirma PROFESSORES: ao abrir o filtro de sentido, NÃO deve haver Pendentes.
# Semantics: mural_filtro_sentido

appId: br.com.polygonus.mobile.amostra
---
- runFlow: ../nav/navegar_mural.yaml

- tapOn:
    id: mural_filtro_sentido

- extendedWaitUntil:
    visible: "Recebidas|Enviadas|Enviados"
    timeout: 5000

- assertNotVisible: "Pendentes"
- assertVisible: "Enviadas"

- pressKey: Back
- pressKey: Back

- extendedWaitUntil:
    visible: ".*MURAL.*"
    timeout: 15000
