# Subflow: abre o BoomMenu FAB na aba Rotina.
#
# Build >= 6.06.22/23: hit-target do `rotina_boom_fab` corrigido (APP-02).
# Menu novo (Go): item `rotina_boom_ocorrencia` vem primeiro; alimentacao
# pode ficar fora da tela. Menu aberto = ocorrencia OU alimentacao.

appId: br.com.polygonus.mobile.amostra
---
- assertVisible:
    id: rotina_boom_fab

- tapOn:
    id: rotina_boom_fab

- waitForAnimationToEnd:
    timeout: 1000

# Menu aberto? Nao usar so alimentacao — no sheet novo ela pode estar abaixo.
- runFlow:
    when:
      notVisible:
        id: "rotina_boom_ocorrencia|rotina_boom_alimentacao"
    commands:
      - tapOn:
          point: "90%,86%"
      - waitForAnimationToEnd:
          timeout: 800

- extendedWaitUntil:
    visible:
      id: "rotina_boom_ocorrencia|rotina_boom_alimentacao"
    timeout: 8000
