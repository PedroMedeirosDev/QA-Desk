# Subflow: abre o BoomMenu FAB na aba Rotina.
# Semantics: rotina_boom_fab

appId: br.com.polygonus.mobile.amostra
---
- tapOn:
    id: rotina_boom_fab
    optional: true

- runFlow:
    when:
      notVisible:
        id: "rotina_boom_fab"
    commands:
      - tapOn:
          point: "92%, 88%"

- waitForAnimationToEnd:
    timeout: 500
