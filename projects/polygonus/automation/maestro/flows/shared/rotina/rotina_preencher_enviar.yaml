# Subflow: preenche turma/aluno/termo mínimo e envia registro de rotina
# Env esperado: TURMA_ROTINA (ou TURMA_TESTE repassado pelo flow), ALUNO_ROTINA, TITULO_ROTINA
#
# ATENÇÃO: perguntas do Termo vêm do servidor — ajuste taps conforme sua entidade.

appId: br.com.polygonus.mobile.amostra
---
- assertVisible: ${TITULO_ROTINA}

# Turma
- tapOn: "Turma"
- tapOn: "${TURMA_TESTE}"
- tapOn: "OK"

# Aluno (grid)
- tapOn: "Aluno"
- tapOn: "${ALUNO_ROTINA}"
- tapOn: "OK"

# Termo — abre lista; toca no primeiro termo visível (ajuste se necessário)
- tapOn: "Termo"
- tapOn:
    index: 0
    optional: true
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

# Respostas dinâmicas: tenta marcar primeira opção Sim/Não ou botão de confirmação
- tapOn:
    text: "Sim"
    optional: true
- tapOn:
    text: "Não"
    optional: true

- tapOn: "Enviar"
- extendedWaitUntil:
    visible: "Registro criado!"
    timeout: 15000
