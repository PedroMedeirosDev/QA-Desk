# Subflow: preenche turma/aluno (+ termo/opções se o CT pedir) e envia.
# Env: TURMA_ROTINA, ALUNO_ROTINA, TITULO_ROTINA
#      TERMO_ROTINA (opcional — só abre picker se preenchido; default da tela basta)
#      OPCAO_ROTINA_1..3 (texto dos chips em cascata, ex. Comida → Jantar → Comeu bem)
#      ANEXAR_FOTOS_ROTINA (opcional — "8" anexa 8 fotos da galeria, Momentos)
#
# Build ≥ 6.06.22 — Semantics:
#   rotina_composer_turma | _aluno | _termo | _ok (só picker Aluno) |
#   _cancelar | _limpar | rotina_composer_opcao_<slug> | rotina_composer_enviar
# Turma/Termo fecham no toque da opção (sem OK). Aluno multi-select → OK.
# Assinatura: "Teste Maestro Emulador - …"

appId: br.com.polygonus.mobile.amostra
---
- assertVisible: ${TITULO_ROTINA}

# Fecha picker residual se um CT anterior/re-tap deixou CANCELAR aberto
- runFlow:
    when:
      visible:
        id: "rotina_composer_cancelar"
    commands:
      - tapOn:
          id: "rotina_composer_cancelar"
      - waitForAnimationToEnd:
          timeout: 400

# —— Turma ——
# Fallback texto só se o campo ainda está no formulário (visível "Turma").
# Não usar só notVisible:id — após tap no id o picker abre e o id some.
- runFlow:
    when:
      visible:
        id: "rotina_composer_turma"
    commands:
      - tapOn:
          id: "rotina_composer_turma"
- runFlow:
    when:
      visible: "^Turma$"
      notVisible:
        id: "rotina_composer_turma"
    commands:
      - tapOn: "^Turma$"
- tapOn: "${TURMA_ROTINA}"
- runFlow:
    when:
      visible: "OK|Ok"
      notVisible:
        id: "rotina_composer_ok"
    commands:
      - tapOn: "OK|Ok"

# —— Aluno (multi-select → rotina_composer_ok) ——
- runFlow:
    when:
      visible:
        id: "rotina_composer_aluno"
    commands:
      - tapOn:
          id: "rotina_composer_aluno"
- runFlow:
    when:
      visible: "^Aluno$"
      notVisible:
        id: "rotina_composer_aluno"
    commands:
      - tapOn: "^Aluno$"
- tapOn: "${ALUNO_ROTINA}"
- runFlow:
    when:
      visible:
        id: "rotina_composer_ok"
    commands:
      - tapOn:
          id: "rotina_composer_ok"
- runFlow:
    when:
      notVisible:
        id: "rotina_composer_ok"
      visible: "OK|Ok"
    commands:
      - tapOn: "OK|Ok"

# —— Termo (só se o CT pedir; senão usa o default da tela) ——
- runFlow:
    when:
      true: ${TERMO_ROTINA != null && TERMO_ROTINA != ""}
    commands:
      - runFlow:
          when:
            visible:
              id: "rotina_composer_termo"
          commands:
            - tapOn:
                id: "rotina_composer_termo"
      - runFlow:
          when:
            visible: "^Termo$"
            notVisible:
              id: "rotina_composer_termo"
          commands:
            - tapOn: "^Termo$"
      - tapOn: "${TERMO_ROTINA}"
      - runFlow:
          when:
            visible: "OK|Ok"
            notVisible:
              id: "rotina_composer_ok"
          commands:
            - tapOn: "OK|Ok"

# Fecha picker residual (ex. termo aberto por engano)
- runFlow:
    when:
      visible:
        id: "rotina_composer_cancelar"
    commands:
      - tapOn:
          id: "rotina_composer_cancelar"

# —— Chips em cascata (texto UI; id opcional se o CT passar OPCAO_ID_*) ——
- runFlow:
    when:
      true: ${OPCAO_ID_1 != null && OPCAO_ID_1 != ""}
    commands:
      - tapOn:
          id: "${OPCAO_ID_1}"
      - waitForAnimationToEnd:
          timeout: 500
- runFlow:
    when:
      true: ${(OPCAO_ID_1 == null || OPCAO_ID_1 == "") && OPCAO_ROTINA_1 != null && OPCAO_ROTINA_1 != ""}
    commands:
      - tapOn: "${OPCAO_ROTINA_1}"
      - waitForAnimationToEnd:
          timeout: 500
- runFlow:
    when:
      true: ${OPCAO_ID_2 != null && OPCAO_ID_2 != ""}
    commands:
      - tapOn:
          id: "${OPCAO_ID_2}"
      - waitForAnimationToEnd:
          timeout: 500
- runFlow:
    when:
      true: ${(OPCAO_ID_2 == null || OPCAO_ID_2 == "") && OPCAO_ROTINA_2 != null && OPCAO_ROTINA_2 != ""}
    commands:
      - tapOn: "${OPCAO_ROTINA_2}"
      - waitForAnimationToEnd:
          timeout: 500
- runFlow:
    when:
      true: ${OPCAO_ID_3 != null && OPCAO_ID_3 != ""}
    commands:
      - tapOn:
          id: "${OPCAO_ID_3}"
      - waitForAnimationToEnd:
          timeout: 500
- runFlow:
    when:
      true: ${(OPCAO_ID_3 == null || OPCAO_ID_3 == "") && OPCAO_ROTINA_3 != null && OPCAO_ROTINA_3 != ""}
    commands:
      - tapOn: "${OPCAO_ROTINA_3}"
      - waitForAnimationToEnd:
          timeout: 500

# —— Um id de opção (CTs simples) ——
- runFlow:
    when:
      true: ${OPCAO_ROTINA_ID != null && OPCAO_ROTINA_ID != ""}
    commands:
      - tapOn:
          id: "${OPCAO_ROTINA_ID}"

# Fallback genérico só se o CT não pediu chips nem fotos
- runFlow:
    when:
      true: ${(OPCAO_ROTINA_1 == null || OPCAO_ROTINA_1 == "") && (OPCAO_ROTINA_ID == null || OPCAO_ROTINA_ID == "") && (ANEXAR_FOTOS_ROTINA == null || ANEXAR_FOTOS_ROTINA == "")}
    commands:
      - tapOn:
          id: "rotina_composer_opcao_nao"
          optional: true
      - tapOn:
          id: "rotina_composer_opcao_0"
          optional: true
      - tapOn:
          text: "Sim"
          optional: true
      - tapOn:
          text: "Não"
          optional: true

# —— Fotos (Momentos) ——
- runFlow:
    when:
      true: ${ANEXAR_FOTOS_ROTINA != null && ANEXAR_FOTOS_ROTINA != ""}
    commands:
      - repeat:
          times: 8
          commands:
            - runFlow: rotina_anexar_foto_galeria.yaml

# —— Enviar ——
- runFlow:
    when:
      visible:
        id: "rotina_composer_enviar"
    commands:
      - tapOn:
          id: "rotina_composer_enviar"
- runFlow:
    when:
      notVisible:
        id: "rotina_composer_enviar"
      visible: "Enviar"
    commands:
      - tapOn: "Enviar"

- extendedWaitUntil:
    visible: "Registro criado!|Rotina|rotina_lista_vazia|Show menu"
    timeout: 20000
