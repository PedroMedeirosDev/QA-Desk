# Subflow: preenche turma/aluno/termo mínimo e envia registro de rotina
# Env: TURMA_ROTINA (ou TURMA_TESTE), ALUNO_ROTINA, TITULO_ROTINA
#
# ATENÇÃO: perguntas do Termo vêm do servidor — ajuste taps conforme a entidade.
# Assinatura nos textos livres: "Teste Maestro Emulador - …"

appId: br.com.polygonus.mobile.amostra
---
- assertVisible: ${TITULO_ROTINA}

# Turma
- tapOn: "Turma"
- tapOn: "${TURMA_ROTINA}"
- tapOn: "OK"

# Aluno (grid)
- tapOn: "Aluno"
- tapOn: "${ALUNO_ROTINA}"
- tapOn: "OK"

# Termo — abre lista; toca no primeiro termo visível (ajuste se necessário)
- tapOn: "Termo"
- tapOn:
    index: 0
    optional: true
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

# Respostas dinâmicas: tenta marcar primeira opção Sim/Não
- tapOn:
    text: "Sim"
    optional: true
- tapOn:
    text: "Não"
    optional: true

# Preferência semantics
- tapOn:
    id: rotina_composer_enviar
    optional: true
- tapOn:
    text: "Enviar"
    optional: true

- extendedWaitUntil:
    visible: "Registro criado!|Rotina"
    timeout: 20000
