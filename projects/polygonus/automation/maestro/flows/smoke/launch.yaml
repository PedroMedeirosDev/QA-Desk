# CT-SMOKE-01: Primeiro acesso — slides de apresentação e chegada ao login
#
# Semantics: auth_onboarding_avancar (fallback coordenada)

appId: br.com.polygonus.mobile.amostra
---
- launchApp:
    clearState: true

- waitForAnimationToEnd
- assertVisible: "Colégio Polygonus"

- repeat:
    times: 5
    commands:
      - runFlow:
          file: ../shared/helpers/tap_id_or_point.yaml
          env:
            SEM_ID: auth_onboarding_avancar
            FALLBACK_POINT: "85%, 91%"
            AFTER_VISIBLE: "FAZER LOGIN|ENTRAR|Acompanhe de perto"
      - waitForAnimationToEnd

- assertVisible: "FAZER LOGIN"
- assertVisible: "RECUPERAR ACESSO POR EMAIL"

- tapOn: "FAZER LOGIN"

- assertVisible: "ENTRAR"
- assertVisible: "E-mail ou Login"
- assertVisible: "Senha"
