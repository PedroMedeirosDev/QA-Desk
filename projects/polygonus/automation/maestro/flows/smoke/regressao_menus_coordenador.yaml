# Smoke regressão — home Coordenador (PHJESUS + COORDENADOR).
# Fora: Chegando. Atendimento = só versão nova (legado removido do perfil).
# Requer APK ≥ 6.06.14 (semantics home_card_*).
#
# cwd: projects/polygonus/automation/maestro
# maestro test flows/smoke/regressao_menus_coordenador.yaml -e LOGIN_PHJESUS=... -e SENHA=...

appId: br.com.polygonus.mobile.amostra
---
- runFlow: ../shared/auth/resume_phjesus_coordenador.yaml

- runFlow: ../shared/nav/navegar_mural.yaml
- runFlow: ../shared/auth/teardown_estavel_sessao.yaml

- runFlow:
    file: ../shared/nav/smoke_abrir_voltar_menu_id.yaml
    env:
      CARD_ID: "home_card_calendario"

- runFlow:
    file: ../shared/nav/smoke_abrir_voltar_menu_id.yaml
    env:
      CARD_ID: "home_card_notas"

- runFlow:
    file: ../shared/nav/smoke_abrir_voltar_menu_id.yaml
    env:
      CARD_ID: "home_card_conteudo_frequencia"

- runFlow:
    file: ../shared/nav/smoke_abrir_voltar_menu_id.yaml
    env:
      CARD_ID: "home_card_tarefas"

- runFlow:
    file: ../shared/nav/smoke_abrir_voltar_menu_id.yaml
    env:
      CARD_ID: "home_card_ocorrencias"

- runFlow:
    file: ../shared/nav/smoke_abrir_voltar_menu_id.yaml
    env:
      CARD_ID: "home_card_meus_alunos"

- runFlow:
    file: ../shared/nav/smoke_abrir_voltar_menu_id.yaml
    env:
      CARD_ID: "home_card_chat"

# Cardápio costuma ser menu custom (slug home_card_02_15) — fallback texto
- runFlow:
    file: ../shared/nav/smoke_abrir_voltar_menu.yaml
    env:
      CARD_HOME: "CARDÁPIO|CARDAPIO|.*CARD[AÁ]PIO.*"

- runFlow: ../shared/auth/teardown_estavel_sessao.yaml
