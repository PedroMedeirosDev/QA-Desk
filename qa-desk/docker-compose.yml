services:
  postgres:
    image: postgres:16-alpine
    container_name: qa-desk-postgres
    restart: unless-stopped
    ports:
      # 5433 no host — evita conflito com Postgres nativo na 5432 (comum no Windows)
      - "5433:5432"
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa_app
    volumes:
      # Volume legado (criado como qa-app_*). Mantido até migrar Supabase → SP.
      - qa_desk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qa_desk_pgdata:
    external: true
    name: qa-app_qa_app_pgdata
